<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding-top: 20px; }
        .post-container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .post-image { width: 100%; border-radius: 8px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="post-container">
            <h1 class="mb-4 text-center">{{ post.title }}</h1>
            <p class="mb-4">{{ post.text }}</p>
            {% if post.image %}
                <img src="{{ post.image.url }}" alt="Post Image" class="post-image">
            {% endif %}
            {% if post.video %}
                <div class="mb-4">
                    <video controls class="w-100">
                        <source src="{{ post.video.url }}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
